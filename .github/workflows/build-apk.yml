
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        run: |
          chmod +x Kama-foundation/gradlew
          Kama-foundation/gradlew -p Kama-foundation assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kama-apk
          path: Kama-foundation/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
